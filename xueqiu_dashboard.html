<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化大类资产打分走势</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:        #f0f2f5;
  --card:      #ffffff;
  --border:    #e8eaed;
  --text:      #1a1a2e;
  --muted:     #8c8c8c;
  --c-red:     #e84d3d;
  --c-orange:  #f97316;
  --c-green:   #389e0d;
  --c-blue:    #1677ff;
  --c-purple:  #722ed1;
  --c-red-bg:    #fff1f0;
  --c-orange-bg: #fff7e6;
  --c-green-bg:  #f6ffed;
  --c-blue-bg:   #e6f4ff;
  --c-purple-bg: #f9f0ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
               "Hiragino Sans GB", "Segoe UI", sans-serif;
  min-height: 100vh;
  padding: 32px 16px 48px;
  color: var(--text);
}

.card {
  max-width: 880px; margin: 0 auto;
  background: var(--card);
  border-radius: 16px;
  padding: 28px 32px 32px;
  box-shadow: 0 2px 16px rgba(0,0,0,.07);
}

.card-title {
  font-size: 22px; font-weight: 700; color: var(--text);
  margin-bottom: 6px; letter-spacing: -.01em;
}
.card-subtitle {
  font-size: 13px; color: var(--muted); margin-bottom: 24px;
}

.scores-row {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.score-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px 14px;
  min-height: 110px;
}
.score-asset {
  font-size: 12px; color: var(--muted);
  margin-bottom: 6px; letter-spacing: .01em;
}
.score-value {
  font-size: 52px; font-weight: 800; line-height: 1;
  margin-bottom: 10px; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
}
.score-chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 4px;
  font-size: 12px; font-weight: 500;
}
.c-red    { color: var(--c-red);    }
.c-orange { color: var(--c-orange); }
.c-green  { color: var(--c-green);  }
.c-blue   { color: var(--c-blue);   }
.c-purple { color: var(--c-purple); }
.bg-red    { background: var(--c-red-bg);    color: var(--c-red);    }
.bg-orange { background: var(--c-orange-bg); color: var(--c-orange); }
.bg-green  { background: var(--c-green-bg);  color: var(--c-green);  }
.bg-blue   { background: var(--c-blue-bg);   color: var(--c-blue);   }
.bg-purple { background: var(--c-purple-bg); color: var(--c-purple); }

.bands { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.band {
  padding: 9px 16px; border-radius: 8px;
  font-size: 14px; font-weight: 500;
}
.band-red    { background: var(--c-red-bg);    color: var(--c-red);    }
.band-orange { background: var(--c-orange-bg); color: var(--c-orange); }
.band-green  { background: var(--c-green-bg);  color: var(--c-green);  }
.band-blue   { background: var(--c-blue-bg);   color: var(--c-blue);   }
.band-purple { background: var(--c-purple-bg); color: var(--c-purple); }

.note {
  font-size: 12px; color: #d48806;
  margin-bottom: 20px; display: flex; align-items: center; gap: 5px;
}

.filter-row {
  display: flex; gap: 8px; margin-bottom: 20px;
}
.pill {
  padding: 7px 18px; border-radius: 20px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--card);
  color: var(--muted); transition: all .15s;
}
.pill:hover { border-color: var(--c-blue); color: var(--c-blue); }
.pill.active {
  background: #1a3a5c; border-color: #1a3a5c; color: #fff;
}

.chart-box { position: relative; height: 300px; }
</style>
</head>

const GRADIENT_BAND = {
  id: 'gradientBand',
  beforeDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.y) return;
    const y4 = scales.y.getPixelForValue(4);
    const y7 = scales.y.getPixelForValue(7);
    const { left, right } = chartArea;
    const grad = ctx.createLinearGradient(0, y7, 0, y4);
    grad.addColorStop(0,   'rgba(239, 68,  68,  0.20)');  // 7分 — 危险红
    grad.addColorStop(0.5, 'rgba(251, 191, 36,  0.12)');  // 中段 — 警示黄
    grad.addColorStop(1,   'rgba(34,  197, 94,  0.20)');  // 4分 — 机会绿
    ctx.save();
    ctx.fillStyle = grad;
    ctx.fillRect(left, y7, right - left, y4 - y7);
    ctx.restore();
  }
};

let assets   = {};
let charts   = [null, null];
let curRange = '3m';

function buildTimeSeries(posts) {
  const map = {};
  posts.forEach(post => {
    if (!post.scores || !post.date) return;
    post.scores.forEach(s => {
      const name = s.name, score = parseFloat(s.score);
      if (isNaN(score)) return;
      if (!map[name]) map[name] = [];
      const existing = map[name].find(x => x.date === post.date);
      if (existing) existing.score = score;
      else map[name].push({ date: post.date, score });
    });
  });
  Object.values(map).forEach(arr => arr.sort((a, b) => a.date.localeCompare(b.date)));
  return map;
}

function scoreInfo(s) {
  const i = BANDS.findIndex(b => s <= b.max);
  return { band: BANDS[i], cls: VALUE_CLS[i] };
}

  const row = document.getElementById('scoresRow');
  const names = Object.keys(assets).filter(n => SHOW_ASSETS.includes(n));
  row.innerHTML = names.map(name => {
    const series = assets[name];
    const latest = series[series.length - 1];
    if (!latest) return '';
    const { band, cls } = scoreInfo(latest.score);
    return `<div class="score-card">
      <div class="score-asset">${esc(name)}</div>
      <div class="score-value ${cls}">${latest.score.toFixed(2)}</div>
      <span class="score-chip ${band.cls}">${band.label}</span>
    </div>`;
  }).join('');
}

function setRange(range, btn) {
  curRange = range;
  document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCharts(range);
}

function cutoffDate(range) {
  const now = new Date();
  if (range === '3m') { now.setMonth(now.getMonth() - 3); return now.toISOString().slice(0, 10); }
  if (range === '1y') { now.setFullYear(now.getFullYear() - 1); return now.toISOString().slice(0, 10); }
  return '0000-00-00';
}

function renderCharts(range) {
  CHART_GROUPS.forEach(({ canvasId, names }, gi) => {
    const cut = cutoffDate(range);
    const validNames = names.filter(n => assets[n]);
    const dateSet = new Set();
    validNames.forEach(n => assets[n].filter(d => d.date >= cut).forEach(d => dateSet.add(d.date)));
    const dates = [...dateSet].sort();
    if (!dates.length) return;

    const datasets = validNames.map((name, i) => {
      const scoreMap = {};
      assets[name].filter(d => d.date >= cut).forEach(d => scoreMap[d.date] = d.score);
      const color = ASSET_COLORS[i % ASSET_COLORS.length];
      return {
        label: name,
        data: dates.map(d => scoreMap[d] ?? null),
        borderColor: color, backgroundColor: color + '18',
        tension: 0.35, fill: false,
        pointRadius: 3, pointHoverRadius: 6, pointBackgroundColor: color,
        spanGaps: true, order: 1,
      };
    });

    datasets.push({ label: '__ref3', data: dates.map(() => 3), borderColor: 'rgba(232,77,61,0.45)', borderWidth: 1.5, borderDash: [6,4], pointRadius: 0, fill: false, tension: 0, order: 2 });
    datasets.push({ label: '__ref8', data: dates.map(() => 8), borderColor: 'rgba(107,114,128,0.4)', borderWidth: 1.5, borderDash: [6,4], pointRadius: 0, fill: false, tension: 0, order: 2 });

    if (charts[gi]) charts[gi].destroy();
    charts[gi] = new Chart(document.getElementById(canvasId), {
      type: 'line',
      plugins: [GRADIENT_BAND],
      data: { labels: dates, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            position: 'top', align: 'end',
            labels: { filter: item => !item.text.startsWith('__'), boxWidth: 24, boxHeight: 3, padding: 16, font: { size: 12 }, usePointStyle: false },
          },
          tooltip: {
            filter: item => !item.dataset.label.startsWith('__'),
            callbacks: { label: ctx => ` ${ctx.dataset.label}：${ctx.parsed.y?.toFixed(2) ?? '—'}` },
          },
        },
        scales: {
          y: {
            min: 0, max: 10,
            grid: { color: '#f0f0f0' },
            ticks: { font: { size: 11 }, color: '#999', stepSize: 1 },
            title: { display: true, text: '打分（越低估值越低）', font: { size: 11 }, color: '#999' },
          },
          x: {
            grid: { display: false },
            ticks: { font: { size: 11 }, color: '#999', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 },
          },
        },
      },
    });
  });
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Auto-init ──────────────────────────────────────────
assets = buildTimeSeries(RAW_POSTS);
const allDates = Object.values(assets).flat().map(d => d.date).filter(Boolean).sort();
document.getElementById('latestDate').textContent = allDates[allDates.length - 1] || '—';
renderScoreCards();
renderCharts(curRange);
</script>
</body>
</html>
