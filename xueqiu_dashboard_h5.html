<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>量化资产打分</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:         #f0f2f5;
  --surface:    #ffffff;
  --border:     #e8eaed;
  --text:       #1a1a2e;
  --muted:      #8c8c8c;
  --c-red:      #e84d3d;
  --c-orange:   #f97316;
  --c-green:    #389e0d;
  --c-blue:     #1677ff;
  --c-purple:   #722ed1;
  --c-red-bg:    #fff1f0;
  --c-orange-bg: #fff7e6;
  --c-green-bg:  #f6ffed;
  --c-blue-bg:   #e6f4ff;
  --c-purple-bg: #f9f0ff;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
  color: var(--text);
  min-height: 100dvh;
  padding-bottom: calc(16px + var(--safe-bot));
}

/* ── 顶部 header ─────────────────── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: calc(12px + var(--safe-top)) 16px 12px;
  display: flex; align-items: baseline; justify-content: space-between;
}
.header-title {
  font-size: 17px; font-weight: 700; letter-spacing: -.02em;
}
.header-meta {
  font-size: 12px; color: var(--muted);
}
.header-meta span { color: var(--c-blue); font-weight: 500; }

/* ── 打分卡片 2×2 ────────────────── */
.scores-section { padding: 14px 12px 0; }
.scores-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.score-card {
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 14px 12px;
  border-left: 3px solid transparent;
  min-height: 100px;
  position: relative;
  overflow: hidden;
}
.score-asset {
  font-size: 11px; font-weight: 500;
  color: var(--muted); letter-spacing: .06em;
  text-transform: uppercase; margin-bottom: 4px;
}
.score-value {
  font-size: 44px; font-weight: 800; line-height: 1;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
  margin-bottom: 8px;
}
.score-chip {
  display: inline-block;
  padding: 3px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 500; line-height: 1.4;
}

/* score colors */
.c-red    { color: var(--c-red);    }
.c-orange { color: var(--c-orange); }
.c-green  { color: var(--c-green);  }
.c-blue   { color: var(--c-blue);   }
.c-purple { color: var(--c-purple); }
.bg-red    { background: var(--c-red-bg);    color: var(--c-red);    }
.bg-orange { background: var(--c-orange-bg); color: var(--c-orange); }
.bg-green  { background: var(--c-green-bg);  color: var(--c-green);  }
.bg-blue   { background: var(--c-blue-bg);   color: var(--c-blue);   }
.bg-purple { background: var(--c-purple-bg); color: var(--c-purple); }

/* card left-border accent matches score color */
.card-accent-red    { border-left-color: var(--c-red);    }
.card-accent-orange { border-left-color: var(--c-orange); }
.card-accent-green  { border-left-color: var(--c-green);  }
.card-accent-blue   { border-left-color: var(--c-blue);   }
.card-accent-purple { border-left-color: var(--c-purple); }

/* ── 时间筛选 ────────────────────── */
.filter-section { padding: 14px 12px 0; }
.filter-bar {
  background: var(--surface);
  border-radius: 12px;
  padding: 4px;
  display: flex; gap: 0;
}
.tab {
  flex: 1;
  padding: 8px 0; border: none; background: none;
  font-size: 13px; font-weight: 500; color: var(--muted);
  border-radius: 9px; cursor: pointer;
  transition: background .15s, color .15s;
}
.tab.active {
  background: #1a3a5c; color: #fff;
}

/* ── 图表区 ──────────────────────── */
.charts-section { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 12px; }
.chart-card {
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 12px 12px;
}
.chart-label {
  font-size: 12px; font-weight: 600; color: var(--muted);
  letter-spacing: .04em; text-transform: uppercase;
  margin-bottom: 10px;
}
.chart-wrap { position: relative; height: 220px; }

/* ── 底部图例 ────────────────────── */
.legend-section {
  margin: 12px 12px 0;
  background: var(--surface);
  border-radius: 14px;
  padding: 14px;
}
.legend-title {
  font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: .06em; text-transform: uppercase;
  margin-bottom: 10px;
}
.band-list { display: flex; flex-direction: column; gap: 6px; }
.band-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  font-size: 12px; font-weight: 500;
}
.band-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.band-item.band-red    { background: var(--c-red-bg);    color: var(--c-red);    }
.band-item.band-orange { background: var(--c-orange-bg); color: var(--c-orange); }
.band-item.band-green  { background: var(--c-green-bg);  color: var(--c-green);  }
.band-item.band-blue   { background: var(--c-blue-bg);   color: var(--c-blue);   }
.band-item.band-purple { background: var(--c-purple-bg); color: var(--c-purple); }
.band-dot-red    { background: var(--c-red);    }
.band-dot-orange { background: var(--c-orange); }
.band-dot-green  { background: var(--c-green);  }
.band-dot-blue   { background: var(--c-blue);   }
.band-dot-purple { background: var(--c-purple); }

.note-row {
  margin-top: 10px;
  font-size: 11px; color: #d48806;
  display: flex; align-items: center; gap: 4px;
}
</style>
</head>
<body>

<header class="header">
  <div class="header-title">量化大类资产打分</div>
  <div class="header-meta">最新 <span id="latestDate">—</span></div>
</header>

<section class="scores-section">
  <div class="scores-grid" id="scoresRow"></div>
</section>

<section class="filter-section">
  <div class="filter-bar">
    <button class="tab active" onclick="setRange('3m',this)">近3个月</button>
    <button class="tab" onclick="setRange('1y',this)">近1年</button>
    <button class="tab" onclick="setRange('all',this)">全部</button>
    <button class="tab" onclick="setRange('7d',this)">近7天</button>
  </div>
</section>

<section class="charts-section">
  <div class="chart-card">

    <div class="chart-wrap"><canvas id="chart1"></canvas></div>
  </div>
  <div class="chart-card">

    <div class="chart-wrap"><canvas id="chart2"></canvas></div>
  </div>
</section>

<section class="legend-section">
  <div class="legend-title">评分区间说明</div>
  <div class="band-list">
    <div class="band-item band-red">   <span class="band-dot band-dot-red"></span>   ≤ 3分 — 熊尾牛初，满仓/可加杠杆</div>
    <div class="band-item band-orange"><span class="band-dot band-dot-orange"></span> 3–5分 — 熊市中期，累进加仓</div>
    <div class="band-item band-green"> <span class="band-dot band-dot-green"></span>  5–7分 — 正常区间，持有观察</div>
    <div class="band-item band-blue">  <span class="band-dot band-dot-blue"></span>   7–8分 — 牛市中期，停止定投</div>
    <div class="band-item band-purple"><span class="band-dot band-dot-purple"></span> ≥ 8分 — 牛市信号，累进减仓至空仓</div>
  </div>
  <div class="note-row">⚠ 分数越低代表估值越低、性价比越高</div>
</section>

const GRADIENT_BAND = {
  id: 'gradientBand',
  beforeDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.y) return;
    const y4 = scales.y.getPixelForValue(4);
    const y7 = scales.y.getPixelForValue(7);
    const { left, right } = chartArea;
    const grad = ctx.createLinearGradient(0, y7, 0, y4);
    grad.addColorStop(0,   'rgba(239, 68,  68,  0.20)');
    grad.addColorStop(0.5, 'rgba(251, 191, 36,  0.12)');
    grad.addColorStop(1,   'rgba(34,  197, 94,  0.20)');
    ctx.save();
    ctx.fillStyle = grad;
    ctx.fillRect(left, y7, right - left, y4 - y7);
    ctx.restore();
  }
};

let assets = {}, charts = [null, null], curRange = '3m';

function buildTimeSeries(posts) {
  const map = {};
  posts.forEach(post => {
    if (!post.scores || !post.date) return;
    post.scores.forEach(s => {
      const name = s.name, score = parseFloat(s.score);
      if (isNaN(score)) return;
      if (!map[name]) map[name] = [];
      const ex = map[name].find(x => x.date === post.date);
      if (ex) ex.score = score;
      else map[name].push({ date: post.date, score });
    });
  });
  Object.values(map).forEach(arr => arr.sort((a, b) => a.date.localeCompare(b.date)));
  return map;
}

function scoreInfo(s) {
  return BANDS[BANDS.findIndex(b => s <= b.max)];
}

function renderScoreCards() {
  const row = document.getElementById('scoresRow');
  const names = SHOW_ASSETS.filter(n => assets[n]);
  row.innerHTML = names.map(name => {
    const series = assets[name];
    const latest = series[series.length - 1];
    if (!latest) return '';
    const band = scoreInfo(latest.score);
    return `<div class="score-card ${band.accentCls}">
      <div class="score-asset">${esc(name)}</div>
      <div class="score-value ${band.valCls}">${latest.score.toFixed(2)}</div>
      <span class="score-chip ${band.cls}">${band.label}</span>
    </div>`;
  }).join('');
}

function cutoffDate(range) {
  const now = new Date();
  if (range === '3m') { now.setMonth(now.getMonth() - 3); return now.toISOString().slice(0, 10); }
  if (range === '1y') { now.setFullYear(now.getFullYear() - 1); return now.toISOString().slice(0, 10); }
  return '0000-00-00';
}

function setRange(range, btn) {
  curRange = range;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCharts(range);
}

function renderCharts(range) {
  CHART_GROUPS.forEach(({ canvasId, names }, gi) => {
    const cut = cutoffDate(range);
    const validNames = names.filter(n => assets[n]);
    const dateSet = new Set();
    validNames.forEach(n => assets[n].filter(d => d.date >= cut).forEach(d => dateSet.add(d.date)));
    let dates = [...dateSet].sort();
    if (range === '7d') dates = dates.slice(-7);
    if (!dates.length) return;

    const datasets = validNames.map((name, i) => {
      const scoreMap = {};
      assets[name].filter(d => d.date >= cut).forEach(d => scoreMap[d.date] = d.score);
      const color = ASSET_COLORS[i % ASSET_COLORS.length];
      return {
        label: name,
        data: dates.map(d => scoreMap[d] ?? null),
        borderColor: color, backgroundColor: color + '18',
        tension: 0.35, fill: false,
        pointRadius: 2, pointHoverRadius: 5, pointBackgroundColor: color,
        spanGaps: true, order: 1,
        borderWidth: 2,
      };
    });

    datasets.push({ label: '__ref3', data: dates.map(() => 3), borderColor: 'rgba(232,77,61,0.4)', borderWidth: 1, borderDash: [5,4], pointRadius: 0, fill: false, tension: 0, order: 2 });
    datasets.push({ label: '__ref8', data: dates.map(() => 8), borderColor: 'rgba(107,114,128,0.35)', borderWidth: 1, borderDash: [5,4], pointRadius: 0, fill: false, tension: 0, order: 2 });

    if (charts[gi]) charts[gi].destroy();
    charts[gi] = new Chart(document.getElementById(canvasId), {
      type: 'line',
      plugins: [GRADIENT_BAND],
      data: { labels: dates, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: {
            position: 'top', align: 'start',
            labels: {
              filter: item => !item.text.startsWith('__'),
              boxWidth: 20, boxHeight: 2, padding: 12,
              font: { size: 11 }, usePointStyle: false,
            },
          },
          tooltip: {
            filter: item => !item.dataset.label.startsWith('__'),
            callbacks: { label: ctx => ` ${ctx.dataset.label}：${ctx.parsed.y?.toFixed(2) ?? '—'}` },
          },
        },
        scales: {
          y: {
            min: 0, max: 10,
            grid: { color: '#f0f0f0' },
            ticks: { font: { size: 10 }, color: '#999', stepSize: 2 },
          },
          x: {
            grid: { display: false },
            ticks: {
              font: { size: 10 }, color: '#999',
              maxRotation: 0, autoSkip: true, maxTicksLimit: 6,
            },
          },
        },
      },
    });
  });
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

assets = buildTimeSeries(RAW_POSTS);
const allDates = Object.values(assets).flat().map(d => d.date).filter(Boolean).sort();
document.getElementById('latestDate').textContent = allDates[allDates.length - 1] || '—';
renderScoreCards();
renderCharts(curRange);
</script>
